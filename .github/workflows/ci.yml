name: CI

on:
  push:
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.18"

      - name: Pin Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (type check)
        run: uv run mypy packages

      - name: Pytest
        run: uv run pytest -q
