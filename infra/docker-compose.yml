# Local dev infrastructure for the Plot Analyzer (base_assumptions §9.1 / §9.3).
# PostGIS + Redis + MinIO with healthchecks. Secrets come from .env (git-ignored);
# .env.example documents the contract. No real secrets are committed.
name: plot-analyzer

services:
  # Combined API (/api) + MCP streamable-http (/mcp) in ONE process (Phase 14B;
  # the Phase 0.1 mount pattern — both surfaces share the in-memory stores).
  # API keys come from the env ONLY (PLOT_API_KEYS="key:role:tenant,...").
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PLOT_API_KEYS: ${PLOT_API_KEYS:-}            # empty = fail closed (F-0477)
      PLOT_DATABASE_URL: ${PLOT_DATABASE_URL:-postgresql+psycopg://plot:plot@postgis:5432/plot}
      PLOT_REDIS_URL: ${PLOT_REDIS_URL:-redis://redis:6379/0}
      PLOT_S3_ENDPOINT_URL: ${PLOT_S3_ENDPOINT_URL:-http://minio:9000}
      PLOT_DEV_HOT_RELOAD: "false"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plot}
      POSTGRES_DB: ${POSTGRES_DB:-plot}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plot} -d ${POSTGRES_DB:-plot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
  minio_data:
