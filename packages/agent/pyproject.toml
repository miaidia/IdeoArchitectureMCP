# plot-agent — orchestration layer: self-improve loop, drawing loop + quick_screening (Phase 4/7).
[project]
name = "plot-agent"
version = "0.1.0"
requires-python = ">=3.12"
# plot_agent is the ORCHESTRATION layer (§9.2 layer 6 / IMPLEMENTATION_PLAN.md Phase 7 §C):
# it composes the lower layers. As of Phase 7 it MAY import plot_connectors (to drive the
# injected connectors) and plot_envelope (overlay/envelope/risk). The decoupling rule that
# must stay intact is connectors↛rules and rules↛connectors — plot_agent depending on both
# does NOT create that cycle (it sits above them).
dependencies = [
    # Vector geometry 2.x for footprint/envelope intersection + area (Phase 0.4).
    "shapely>=2.0",
    # Typed, validated proposals + scores (Phase 0.4 "Schemas/validation").
    "pydantic>=2",
    # Workspace deps (orchestration layer).
    "plot-domain",
    "plot-shared",
    "plot-rules",
    "plot-reports",
    "plot-geo",
    "plot-connectors",
    "plot-envelope",
]

[tool.uv.sources]
plot-domain = { workspace = true }
plot-shared = { workspace = true }
plot-rules = { workspace = true }
plot-reports = { workspace = true }
plot-geo = { workspace = true }
plot-connectors = { workspace = true }
plot-envelope = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plot_agent"]
