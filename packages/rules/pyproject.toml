# plot-rules — declarative versioned ruleset loader + rule evaluation engine (Phase 8).
[project]
name = "plot-rules"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Rulesets are versioned YAML files (base_assumptions §12.2) loaded fresh in dev.
    "pyyaml>=6.0",
    # Phase 8: structural validation of ruleset YAML (engine contract, §12.1).
    "jsonschema>=4.21",
    # Phase 8: RuleCheck result model (§12.1 pass/fail/warning/unknown/not_applicable).
    "pydantic>=2",
    # Phase 8: expert-override hook reuses the audited Override model (§26.1, NFR-AUD-003).
    # Only plot_domain.models is imported — never plot_domain.db (domain package rule).
    "plot-domain",
]

[tool.uv.sources]
plot-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plot_rules"]
