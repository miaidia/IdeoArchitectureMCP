# plot-rules — declarative versioned ruleset loader (Phase 2 backbone; engine in Phase 8).
[project]
name = "plot-rules"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Rulesets are versioned YAML files (base_assumptions §12.2) loaded fresh in dev.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plot_rules"]
