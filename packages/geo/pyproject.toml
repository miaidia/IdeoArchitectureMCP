# plot-geo — geometry & spatial core (Phase 5).
#
# CRS detection/transform, topology validation + repair, multipart handling,
# shape metrics, largest inscribed rectangle (custom — shapely has no built-in),
# overlay/buffer/clip engine wrappers, and input-hash/snapshot. All metric
# operations run in the analytical CRS EPSG:2180 (base_assumptions §9.4 / §26.3).
#
# Decoupling rule (Phase 1.4 / §9.4): plot_geo must NOT import plot_connectors
# or plot_rules.
[project]
name = "plot-geo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.1",
    "pyproj>=3.7",
    "geopandas>=1.1",
    "numpy>=1.26",
    "plot-domain",
    "plot-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plot_geo"]

[tool.uv.sources]
plot-domain = { workspace = true }
plot-shared = { workspace = true }
