# plot-security — upload sandbox + file-safety policy (Phase 14B; F-0491–0493, §16).
[project]
name = "plot-security"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Settings (size/type/page caps come from env-only config; F-0477).
    "plot-shared",
]

[tool.uv.sources]
plot-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plot_security"]
