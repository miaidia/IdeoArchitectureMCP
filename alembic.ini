# Alembic configuration for the Plot Analyzer DB (PostGIS, EPSG:2180 analytical CRS).
# The DB URL is supplied at runtime from the environment (PLOT_DATABASE_URL) via
# migrations/env.py — no secrets are committed here.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# sqlalchemy.url is intentionally left blank; env.py reads it from Settings/env.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
