# Typologia projektowa (Phase 11 §11.1.2) — SUGESTIA, nigdy walidator (plan §11.4).
# basis: design_practice — wartości to reguły dobrej praktyki, NIE wartości prawne.
id: PL-TYP-WIELORODZINNY-TRAKT-001
title: Zasada traktu wielorodzinnego (trakt 12-18 m, sekcja 20-35 m)
jurisdiction: PL
valid_from: 2026-01-01
valid_to: null
source_reference: >-
  rulesets/PL/typologies/sources.md — design_practice (zasady projektowe, bez
  mocy prawnej)
basis: design_practice
legal_force: none
severity: soft
inputs:
  - shape_class
  - width_m
outputs:
  - typology_recommendation
summary: >-
  Uniwersalna zasada kompozycji budynku wielorodzinnego: trakt (głębokość
  skrzydła) 12-18 m zapewnia doświetlone mieszkania dwustronne; jedna klatka
  obsługuje 2-6 mieszkań na kondygnacji; sekcja (klatka + mieszkania) ma
  20-35 m długości i jest modułem składania pierzei.
applicability:
  when: {}   # zasada bazowa — ma zastosowanie do każdej działki wielorodzinnej
parameters:
  trakt_depth_m: {min: 12, max: 18}
  mieszkania_na_klatke_na_kondygnacje: {min: 2, max: 6}
  section_length_m: {min: 20, max: 35}
pros:
  - "mieszkania przewietrzane na przestrzał przy trakcie do 18 m"
  - "moduł sekcji 20-35 m elastycznie składa pierzeje o dowolnej długości"
cons:
  - "trakt powyżej 18 m generuje ciemne strefy środkowe (aneksowe łazienki/garderoby)"
preference:
  base: 0.5
  bonuses: []
notes: >-
  Zasada bazowa cytowana w brief-ie jako rama wymiarowa dla pozostałych
  typologii (kwartał, klatkowiec, punktowiec dziedziczą trakt/sekcję).
