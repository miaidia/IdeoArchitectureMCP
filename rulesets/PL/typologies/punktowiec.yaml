# Typologia projektowa (Phase 11 §11.1.2) — SUGESTIA, nigdy walidator (plan §11.4).
id: PL-TYP-PUNKTOWIEC-001
title: Punktowiec — wolnostojący budynek z centralną klatką, mały rzut
jurisdiction: PL
valid_from: 2026-01-01
valid_to: null
source_reference: >-
  rulesets/PL/typologies/sources.md — design_practice (zasady projektowe, bez
  mocy prawnej)
basis: design_practice
legal_force: none
severity: soft
inputs:
  - shape_class
  - width_m
outputs:
  - typology_recommendation
summary: >-
  Wolnostojący budynek punktowy o zwartym rzucie (ok. 400-650 m²) z centralną
  klatką/windą obsługującą 4-8 mieszkań na kondygnacji; dobrze wykorzystuje
  wąskie i małe działki, doświetla mieszkania z 2-3 stron.
applicability:
  when: {}   # punktowiec mieści się na niemal każdej działce wielorodzinnej
parameters:
  footprint_m2: {min: 400, max: 650}
  mieszkania_na_kondygnacje: {min: 4, max: 8}
  typical_floors: {min: 5, max: 16}
  trakt_depth_m: {min: 16, max: 24}
pros:
  - "mały rzut: wchodzi na działki, na których pierzeja się nie mieści"
  - "ekspozycja mieszkań na 2-3 strony świata (narożne doświetlenie)"
cons:
  - "niska intensywność na dużych działkach w porównaniu z kwartałem"
  - "wymaga odstępów §13/§60 między punktowcami (cień/przesłanianie)"
preference:
  base: 0.45
  bonuses:
    - when: {shape_class: narrow}
      add: 0.25
      why: "wąska działka: zwarty rzut punktowca nie wymaga długiej pierzei"
    - when: {width_m: {max: 40}}
      add: 0.1
      why: "szerokość działki ≤40 m wyklucza głębsze układy traktowe podwójne"
