# plot-worker — Dramatiq worker app (Phase 13 / v1 Phase 11 §11.1.3).
# Wraps the SHARED plot_agent use-cases (portfolio/monitoring/cache-warm/full
# analysis) in queue actors; broker (Redis vs StubBroker) comes from env settings.
[project]
name = "plot-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "plot-shared",
    "plot-domain",
    # The actors execute the shared orchestration-layer use-cases (§27).
    "plot-agent",
    # Queue + Redis broker (Phase 0.4 allowed stack; StubBroker for tests).
    "dramatiq[redis]>=1.17",
]

[tool.uv.sources]
plot-shared = { workspace = true }
plot-domain = { workspace = true }
plot-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plot_worker"]
